<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Text Emotion Detection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>AI Text Emotion Detection</h1>
    <p>Enter a sentence to detect emotion</p>

    <textarea
        id="textInput"
        placeholder="Type your sentence here..."
        rows="4"
        style="width:100%; padding:10px;"
    ></textarea>

    <button id="detectBtn">Detect Emotion</button>

    <div id="result">
        <h2 id="emotion"></h2>
        <p id="confidence"></p>
    </div>
</div>

<!-- IMPORTANT -->
<script src="js/app.js"></script>

</body>
</html>
