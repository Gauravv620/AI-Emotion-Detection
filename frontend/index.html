<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Emotion Detection</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>AI Emotion Detection System</h1>

  
    <section class="card">
        <h2>Text Emotion Detection</h2>
        <textarea id="textInput"
                  placeholder="Type your sentence here..."
                  rows="4"></textarea>
        <button id="textBtn">Detect Text Emotion</button>

        <p id="textEmotion"></p>
        <p id="textConfidence"></p>
    </section>

    <section class="card">
        <h2>Face Emotion Detection</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button id="faceBtn">Detect Face Emotion</button>

        <p id="faceEmotion"></p>
        <p id="faceConfidence"></p>
    </section>
</div>

<script src="js/app.js"></script>
</body>
</html>
